name: Build ESP32-WROOM firmware

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Arduino CLI
        uses: arduino/setup-arduino-cli@v2

      - name: Install ESP32 core
        run: |
          arduino-cli config init --overwrite
          arduino-cli config add board_manager.additional_urls https://espressif.github.io/arduino-esp32/package_esp32_index.json
          arduino-cli core update-index
          arduino-cli core install esp32:esp32

      - name: Compile ESP32-WROOM firmware
        run: |
          mkdir -p build
          arduino-cli compile \
            --fqbn esp32:esp32:esp32 \
            --output-dir build \
            .

      - name: Name web-update binary
        run: |
          BIN="$(find build -maxdepth 1 -type f -name '*.ino.bin' | head -n 1)"
          test -n "$BIN"
          cp "$BIN" build/NanoLeadAcidChargerSM.bin
          ls -lh build/NanoLeadAcidChargerSM.bin

      - name: Upload firmware artifact
        uses: actions/upload-artifact@v4
        with:
          name: NanoLeadAcidChargerSM-ESP32-WROOM-firmware
          path: build/NanoLeadAcidChargerSM.bin
